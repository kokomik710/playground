<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Leta and Mnema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root { --u: 2px; --ctlB: 18px; }
  html, body { margin:0; height:100%; background:#000; overflow:hidden; overscroll-behavior:none;
    touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent; }
  body { font-family:'DotGothic16','MS Gothic','Courier New',monospace; color:#d8dee4; }

  /* --- stage: the "TV screen". Everything inside is sized in --u (1/240 of its height) --- */
  #stage { position:absolute; overflow:hidden; background:#000; }
  #view { position:absolute; left:0; top:0; width:100%; height:100%; display:block;
    image-rendering:crisp-edges; image-rendering:pixelated; }
  #view.smooth { image-rendering:auto; }
  #crt { position:absolute; inset:0; pointer-events:none; z-index:6;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) calc(var(--u)*.55), rgba(0,0,0,.17) calc(var(--u)*.55), rgba(0,0,0,.17) var(--u)),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 52%, rgba(0,0,0,.5) 100%); }
  #ui { position:absolute; inset:0; z-index:3; }
  #fade { position:absolute; inset:0; background:#000; opacity:1; pointer-events:none; z-index:5; }
  #boot { position:absolute; inset:0; z-index:7; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:0 8%; font-size:max(calc(var(--u)*9),13px); color:#8794a0; }

  /* --- menus --- */
  #menu { position:absolute; inset:0; display:none; flex-direction:column; align-items:center;
    justify-content:flex-end; box-sizing:border-box; padding-bottom:calc(var(--u)*17); z-index:2; }
  #menu.on { display:flex; }
  #menu.pause { background:rgba(3,6,10,.74); justify-content:center; padding-bottom:0; }
  #titleCanvas { display:none; position:absolute; top:calc(var(--u)*24); left:50%; width:calc(var(--u)*320);
    height:calc(var(--u)*64); margin-left:calc(var(--u)*-160); image-rendering:crisp-edges; image-rendering:pixelated; }
  #menu.main #titleCanvas { display:block; }
  #menuHead { font-size:max(calc(var(--u)*8),12px); letter-spacing:.3em; color:#7c8a97; margin-bottom:calc(var(--u)*5);
    text-shadow:max(1px,var(--u)) max(1px,var(--u)) 0 #000; }
  #menuHead:empty { display:none; }
  #menuList { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; align-items:center; }
  #menuList li { position:relative; padding:calc(var(--u)*2.2) calc(var(--u)*12); font-size:max(calc(var(--u)*11),15px);
    line-height:1.35; letter-spacing:.08em; color:#8693a0; white-space:nowrap; cursor:pointer;
    text-shadow:max(1px,var(--u)) max(1px,var(--u)) 0 #000; }
  #menuList li.sel { color:#f2f5f7; }
  #menuList li.dis { color:#48515a; cursor:default; }
  #menuList li.sel::before { content:''; position:absolute; left:0; top:50%; margin-top:-.3em;
    border-left:.5em solid #f2f5f7; border-top:.3em solid transparent; border-bottom:.3em solid transparent;
    animation:blink 1s step-end infinite; }
  #menuList .k { display:inline-block; width:7em; text-align:left; }
  #menuList .v { display:inline-block; width:5.6em; text-align:center; }
  #menuList .ar { display:inline-block; padding:0 .5em; color:#6f7c89; }
  #menuList li.sel .ar { color:#c9d2da; }
  #menuList .bar i { display:inline-block; width:.3em; height:.7em; margin:0 .06em; background:#3b444d; }
  #menuList .bar i.on { background:#dfe5ea; }
  @keyframes blink { 50% { opacity:0; } }

  /* --- classic text box --- */
  #dialog { position:absolute; left:calc(var(--u)*9); right:calc(var(--u)*9); bottom:calc(var(--u)*8); display:none;
    box-sizing:border-box; padding:calc(var(--u)*6) calc(var(--u)*9) calc(var(--u)*7);
    background:linear-gradient(to bottom, rgba(10,18,30,.88), rgba(3,6,12,.92));
    border:max(1px,var(--u)) solid #a9b5c0; box-shadow:0 0 0 max(1px,var(--u)) #05080c, inset 0 0 0 max(1px,var(--u)) #1a2634;
    font-size:max(calc(var(--u)*10.5),15px); line-height:1.38; color:#eef1f4; z-index:3;
    text-shadow:max(1px,var(--u)) max(1px,var(--u)) 0 #000; cursor:pointer; }
  #dialog.on { display:block; }
  #dlgName { font-size:.82em; letter-spacing:.14em; color:#9db0c2; margin-bottom:calc(var(--u)*1.5); }
  #dlgName:empty { display:none; }
  #dlgText { white-space:pre-wrap; min-height:2.76em; }
  #dialog.thought #dlgText { color:#c3d0dc; }
  #dlgText .ghost { visibility:hidden; }
  #dlgNext { position:absolute; right:calc(var(--u)*7); bottom:calc(var(--u)*4); width:0; height:0;
    border-top:.5em solid #eef1f4; border-left:.32em solid transparent; border-right:.32em solid transparent;
    animation:blink .8s step-end infinite; }
  #dlgChoices { display:none; justify-content:flex-end; gap:calc(var(--u)*14); margin-top:calc(var(--u)*2); padding-right:calc(var(--u)*6); }
  #dlgChoices.has { display:flex; visibility:hidden; }
  #dlgChoices.has.on { visibility:visible; }
  #dlgChoices span { position:relative; padding:0 .3em 0 .9em; color:#8693a0; }
  #dlgChoices span.sel { color:#f2f5f7; }
  #dlgChoices span.sel::before { content:''; position:absolute; left:0; top:50%; margin-top:-.3em;
    border-left:.5em solid #f2f5f7; border-top:.3em solid transparent; border-bottom:.3em solid transparent; }

  #hint, #tip { position:absolute; left:0; right:0; text-align:center; pointer-events:none; opacity:0; transition:opacity .25s;
    font-size:max(calc(var(--u)*8),12px); letter-spacing:.12em; color:#b9c5d0; text-shadow:max(1px,var(--u)) max(1px,var(--u)) 0 #000; z-index:1; }
  #hint { bottom:calc(var(--u)*9); }
  #tip { top:calc(var(--u)*9); letter-spacing:.04em; padding:0 6%; white-space:pre-wrap; }
  #hint.on, #tip.on { opacity:.92; }

  /* --- on-screen touch controls --- */
  #touch { position:fixed; inset:0; z-index:20; pointer-events:none; display:none; font-family:inherit; }
  body.touch #touch { display:block; }
  #dpad { position:absolute; left:calc(14px + env(safe-area-inset-left, 0px)); bottom:calc(var(--ctlB) + env(safe-area-inset-bottom, 0px));
    width:136px; height:136px; border-radius:50%; pointer-events:auto; touch-action:none;
    background:radial-gradient(circle, rgba(150,165,180,.04) 38%, rgba(150,165,180,.17) 100%); border:2px solid rgba(190,205,220,.26); }
  #dpad::before, #dpad::after { content:''; position:absolute; left:50%; top:50%; background:rgba(200,214,226,.16); }
  #dpad::before { width:2px; height:76%; margin:-38% 0 0 -1px; }
  #dpad::after { height:2px; width:76%; margin:-1px 0 0 -38%; }
  #dpadKnob { position:absolute; left:50%; top:50%; width:54px; height:54px; margin:-27px 0 0 -27px; border-radius:50%;
    background:rgba(200,212,224,.26); border:2px solid rgba(222,232,240,.42); box-sizing:border-box; }
  .tbtn { position:absolute; width:70px; height:70px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    box-sizing:border-box; font-size:14px; letter-spacing:.06em; color:rgba(228,235,241,.82); pointer-events:auto; touch-action:none;
    background:rgba(150,165,180,.12); border:2px solid rgba(190,205,220,.3); }
  .tbtn.down { background:rgba(205,216,226,.36); }
  #btnAct { right:calc(14px + env(safe-area-inset-right, 0px)); bottom:calc(var(--ctlB) + 60px + env(safe-area-inset-bottom, 0px)); }
  #btnAct.glow { border-color:rgba(240,246,250,.9); color:#fff; box-shadow:0 0 14px rgba(200,220,240,.35); }
  #btnRun { right:calc(92px + env(safe-area-inset-right, 0px)); bottom:calc(var(--ctlB) + env(safe-area-inset-bottom, 0px)); }
  #btnPause { display:none; width:40px; height:40px; font-size:12px; right:calc(8px + env(safe-area-inset-right, 0px));
    top:calc(8px + env(safe-area-inset-top, 0px)); }
  body.playing #btnPause { display:flex; }
  body.talk #dpad, body.talk #btnRun { opacity:0; pointer-events:none; }      /* keep the text box clear */
</style>
</head>
<body>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="ui">
    <div id="tip"></div>
    <div id="hint"></div>
    <div id="menu">
      <canvas id="titleCanvas" width="320" height="64"></canvas>
      <div id="menuHead"></div>
      <ul id="menuList"></ul>
    </div>
    <div id="dialog">
      <div id="dlgName"></div>
      <div id="dlgText"></div>
      <div id="dlgChoices"></div>
      <div id="dlgNext"></div>
    </div>
    <div id="fade"></div>
    <div id="boot">Loading...</div>
  </div>
  <div id="crt"></div>
</div>
<div id="touch">
  <div id="dpad"><div id="dpadKnob"></div></div>
  <div id="btnRun" class="tbtn">RUN</div>
  <div id="btnAct" class="tbtn">ACT</div>
  <div id="btnPause" class="tbtn">II</div>
</div>

<script type="module">
/* =============================================================================
   LETA AND MNEMA  --  PS1-style fixed-camera horror adventure, single file.

   Sections
     1. Config & small utilities
     2. Settings + save system (localStorage)
     3. Audio (procedural WebAudio: wind, drone, footsteps, UI blips, menu motif)
     4. PS1 renderer: low-res target, vertex snapping, affine UVs, dither/VHS post
     5. Procedural 64x64 textures
     6. Geometry helpers + static world builder (baked vertex shading)
     7. Characters (Leta, Mnema) built from primitives + procedural animation
     8. Scene registry   -> registerScene(id, def)      (add new locations here)
     9. Chapter registry -> registerChapter(id, def)    (add new chapters here)
    10. Dialogue box
    11. Menus (main / settings / pause)
    12. Input (keyboard + touch)
    13. Game: state machine, player controller, camera zones, interactions
    14. Boot
   ============================================================================= */

/* ---------- 1. CONFIG & UTILITIES ---------------------------------------- */
const CFG = {
  three: ['https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js',
          'https://unpkg.com/three@0.160.0/build/three.module.min.js'],
  baseH: 240,                     // internal vertical resolution (width follows the aspect: 320..426)
  minAspect: 4 / 3, maxAspect: 16 / 9,
  saveKey: 'letaMnema.save.v1', settingsKey: 'letaMnema.settings.v1',
  walkSpeed: 1.35, runSpeed: 3.1, backSpeed: 0.85, turnSpeed: 2.6, playerRadius: 0.28,
  textSpeed: 42,                  // characters per second in the text box
};
let THREE = null;                 // set in boot()
const $ = (s) => document.querySelector(s);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ramp = (a, b, x) => clamp((x - a) / (b - a), 0, 1);       // works for a > b too
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function fadeTo(opacity, ms) {
  const f = $('#fade'); f.style.transition = `opacity ${ms}ms linear`; f.style.opacity = opacity;
  return new Promise((r) => setTimeout(r, ms + 40));
}

/* ---------- 2. SETTINGS + SAVE SYSTEM ------------------------------------ */
const Settings = {
  data: { volume: 7, controls: 'tank', pixelation: true },
  load() { try { Object.assign(this.data, JSON.parse(localStorage.getItem(CFG.settingsKey)) || {}); } catch (e) { /* defaults */ } },
  save() { try { localStorage.setItem(CFG.settingsKey, JSON.stringify(this.data)); } catch (e) { /* private mode */ } },
};
const SaveSys = {
  read() { try { const d = JSON.parse(localStorage.getItem(CFG.saveKey)); return d && d.v === 1 ? d : null; } catch (e) { return null; } },
  has() { return !!this.read(); },
  /* Snapshot of everything a chapter needs to resume: where we are and what has been seen. */
  write(game) {
    const p = game.player;
    const d = { v: 1, chapter: game.chapterId, scene: game.sceneId, x: p.x, z: p.z, rot: p.rot,
                flags: game.flags, playtime: Math.round(game.playtime), at: Date.now() };
    try { localStorage.setItem(CFG.saveKey, JSON.stringify(d)); return true; } catch (e) { return false; }
  },
};

/* ---------- 3. AUDIO ----------------------------------------------------- */
const Sfx = {
  ctx: null, master: null, brown: null, white: null, musicOn: false, musicTimer: 0,
  /* Browsers only allow audio after a user gesture, so this is called from every input handler. */
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
      this.setVolume(Settings.data.volume);
      this.brown = this.noiseBuffer(true); this.white = this.noiseBuffer(false);
      this.startAmbience();
      if (this.musicOn) this.setMusic(true);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  setVolume(v) { if (this.master) this.master.gain.value = Math.pow(v / 10, 1.5) * 0.9; },
  noiseBuffer(brown) {
    const len = this.ctx.sampleRate * 2, b = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = b.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; if (brown) { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } else d[i] = w; }
    return b;
  },
  /* Looping wind (filtered noise with slow LFOs) plus a barely audible low drone. */
  startAmbience() {
    const c = this.ctx, src = c.createBufferSource(); src.buffer = this.brown; src.loop = true;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 330; bp.Q.value = 0.7;
    const g = c.createGain(); g.gain.value = 0.55;
    const l1 = c.createOscillator(), g1 = c.createGain(); l1.frequency.value = 0.07; g1.gain.value = 150; l1.connect(g1); g1.connect(bp.frequency);
    const l2 = c.createOscillator(), g2 = c.createGain(); l2.frequency.value = 0.11; g2.gain.value = 0.25; l2.connect(g2); g2.connect(g.gain);
    src.connect(bp); bp.connect(g); g.connect(this.master); src.start(); l1.start(); l2.start();
    for (const f of [55, 55.6, 82.6]) { const o = c.createOscillator(), og = c.createGain(); o.frequency.value = f; og.gain.value = 0.03; o.connect(og); og.connect(this.master); o.start(); }
  },
  tone(f, dur, type = 'square', vol = 0.04, f2 = 0, delay = 0) {
    if (!this.ctx) return; const c = this.ctx, t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.03);
  },
  burst(dur, freq, vol) {
    if (!this.ctx) return; const c = this.ctx, t = c.currentTime, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.white; f.type = 'lowpass'; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t, Math.random() * 1.5, dur + 0.05);
  },
  ui(kind) {
    if (kind === 'move') this.tone(520, 0.05, 'square', 0.028);
    else if (kind === 'ok') { this.tone(660, 0.07, 'square', 0.035); this.tone(990, 0.11, 'square', 0.03, 0, 0.06); }
    else if (kind === 'back') this.tone(330, 0.1, 'square', 0.03, 200);
    else if (kind === 'text') this.tone(1100 + Math.random() * 90, 0.016, 'square', 0.011);
    else if (kind === 'save') { [392, 523, 659].forEach((f, i) => this.tone(f, 0.22, 'triangle', 0.06, 0, i * 0.13)); }
  },
  step(run) { this.burst(run ? 0.06 : 0.08, run ? 1100 : 750, run ? 0.16 : 0.1); },
  /* Sparse, slow title-screen motif. */
  setMusic(on) {
    this.musicOn = on; if (!this.ctx) return;
    if (on && !this.musicTimer) {
      const seq = [220, 329.6, 261.6, 246.9, 220, 329.6, 293.7, 261.6, 174.6, 261.6, 220, 196, 164.8, 246.9, 207.7, 246.9]; let i = 0;
      const play = () => { if (!this.musicOn) return; const f = seq[i % seq.length]; this.pad(f, 2.8, 0.05); if (i % 4 === 0) this.pad(f / 2, 4.5, 0.035); i++; };
      play(); this.musicTimer = setInterval(play, 1500);
    } else if (!on && this.musicTimer) { clearInterval(this.musicTimer); this.musicTimer = 0; }
  },
  pad(f, dur, vol) {
    const c = this.ctx, t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.05);
  },
};

/* ---------- 4. PS1 RENDERER ---------------------------------------------- */
/* Uniform objects shared by every world material (fog, lights, snapping grid). */
let SHARED = null;
function initShared() {
  SHARED = {
    uSnap: { value: new THREE.Vector2(320, 240) },       // vertices snap to this virtual pixel grid
    uAffine: { value: 0.55 },                            // 0 = perspective-correct UVs, 1 = fully affine (PS1)
    uFogColor: { value: new THREE.Color(0.37, 0.43, 0.49) }, uFogNear: { value: 4 }, uFogFar: { value: 38 },
    uAmbSky: { value: new THREE.Color(0.6, 0.66, 0.74) }, uAmbGnd: { value: new THREE.Color(0.3, 0.32, 0.36) },
    uSunDir: { value: new THREE.Vector3(-0.4, 0.8, 0.45).normalize() }, uSunCol: { value: new THREE.Color(0.28, 0.28, 0.27) },
    uPLPos: { value: [0, 1, 2].map(() => new THREE.Vector4(0, -99, 0, 0.001)) },   // xyz + radius
    uPLCol: { value: [0, 1, 2].map(() => new THREE.Color(0, 0, 0)) },
  };
}
const PS1_VERT = `
  uniform vec2 uSnap; uniform float uFogNear, uFogFar, uFogMax, uUnlit;
  uniform vec3 uAmbSky, uAmbGnd, uSunDir, uSunCol;
  uniform vec4 uPLPos[3]; uniform vec3 uPLCol[3];
  varying vec2 vUv; varying vec3 vUvA; varying vec3 vCol; varying float vFog;
  void main() {
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vec4 mv = viewMatrix * wp;
    vec4 clip = projectionMatrix * mv;
    // PS1 vertex jitter: no sub-pixel precision, vertices snap to whole pixels
    if (clip.w > 0.0) { vec2 grid = uSnap * 0.5; clip.xy = floor(clip.xy / clip.w * grid + 0.5) / grid * clip.w; }
    gl_Position = clip;
    vUv = uv;
    vUvA = vec3(uv * clip.w, clip.w);          // uv * w, undone per fragment => screen-space (affine) interpolation
    vec3 lit = vec3(1.0);
    if (uUnlit < 0.5) {                        // per-vertex lighting on flat normals = faceted, "baked" look
      vec3 n = normalize((vec4(normalMatrix * normal, 0.0) * viewMatrix).xyz);
      lit = mix(uAmbGnd, uAmbSky, n.y * 0.5 + 0.5) + uSunCol * max(dot(n, uSunDir), 0.0);
      for (int i = 0; i < 3; i++) {
        vec3 d = uPLPos[i].xyz - wp.xyz; float dist = length(d);
        float a = clamp(1.0 - dist / uPLPos[i].w, 0.0, 1.0);
        lit += uPLCol[i] * a * a * (0.35 + 0.65 * max(dot(n, d / max(dist, 0.001)), 0.0));
      }
    }
    vCol = color * lit;
    vFog = clamp((-mv.z - uFogNear) / (uFogFar - uFogNear), 0.0, 1.0) * uFogMax;
  }`;
const PS1_FRAG = `
  uniform sampler2D uMap; uniform vec3 uFogColor; uniform float uAffine, uAffineK, uOpacity;
  varying vec2 vUv; varying vec3 vUvA; varying vec3 vCol; varying float vFog;
  void main() {
    vec2 uv = mix(vUv, vUvA.xy / vUvA.z, uAffine * uAffineK);
    vec4 t = texture2D(uMap, uv);
    #ifdef CUT
      if (t.a < 0.5) discard;
    #endif
    vec3 c = t.rgb * vCol;
    #ifdef ADD
      c *= (1.0 - vFog);
    #else
      c = mix(c, uFogColor, vFog);
    #endif
    #ifdef BLEND
      gl_FragColor = vec4(c, t.a * uOpacity);
    #else
      gl_FragColor = vec4(c, 1.0);
    #endif
  }`;
/* One material for the whole world. Options: map, cut (alpha test), blend, additive, unlit, fogMax, side (0 front / 1 back / 2 double). */
function ps1Material(o = {}) {
  const soft = !!(o.blend || o.additive);
  const defines = {}; if (o.cut) defines.CUT = 1; if (soft) defines.BLEND = 1; if (o.additive) defines.ADD = 1;
  return new THREE.ShaderMaterial({
    uniforms: { ...SHARED, uMap: { value: o.map || TEX.white }, uOpacity: { value: o.opacity ?? 1 }, uUnlit: { value: o.unlit ? 1 : 0 },
                uFogMax: { value: o.fogMax ?? 1 }, uAffineK: { value: o.affine ?? 1 } },
    vertexShader: PS1_VERT, fragmentShader: PS1_FRAG, defines, vertexColors: true,
    side: o.side === 2 ? THREE.DoubleSide : o.side === 1 ? THREE.BackSide : THREE.FrontSide,

const CHAR_DEFS = {

/* Builds a segmented PS1-style character. Returns { root, J (joints), update(dt, motion), emote(name) }.

function createCharacter(kind) {

  const M = { plain: ps1Material({ map: TEX.white }), hair: ps1Material({ map: TEX.white, side: 2 }), face: ps1Material({ map: TEX[kind + 'Face'] }),

    const kn = J['knee' + n] = joint(up, 0, -0.40, 0); mesh(kn, limb(0.045, 0.034, 0.38, 6, SKIN), M.plain);
    mesh(kn, limb(0.041, 0.039, 0.14, 6, SOCK, true), M.plain, 0, -0.24, 0);

  const shadow = new THREE.Mesh(paint(new THREE.PlaneGeometry(0.75, 0.75).rotateX(-Math.PI / 2), [0, 0, 0]), shMat); shadow.position.y = 0.02; root.add(shadow);

  const ch = { kind, def: D, root, J, tris, onStep: null, anim: { t: Math.random() * 10, phase: 0, blend: 0, run: 0, blink: D.blinkEvery, emote: null, emoteT: 0, emoteDur: 1 } };
  ch.emote = (name, dur = 2.4) => { ch.anim.emote = name; ch.anim.emoteT = 0; ch.anim.emoteDur = dur; };
  /* motion = { speed: signed m/s along facing, run: bool } */

const Input = {

const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',

  });
  window.addEventListener('keyup', (e) => { const k = KEYMAP[e.code]; if (k) Input.held[k] = false; });
  window.addEventListener('blur', () => { Input.held = {}; });
  window.addEventListener('contextmenu', (e) => e.preventDefault());

    const dir = m < 0.45 ? '' : Math.abs(x) > Math.abs(y) ? (x > 0 ? 'right' : 'left') : (y > 0 ? 'down' : 'up');

/* Oriented-box helpers (boxes rotate about y like three.js objects). */

  const px = b.hw - Math.abs(lx), pz = b.hd - Math.abs(lz);                       // centre is inside: leave through the nearest side

}

  async startNewGame() {
    this.mode = 'transition'; Menu.closeAll(); Sfx.setMusic(false); await fadeTo(1, 900);
    this.flags = {}; this.playtime = 0; this.chapterId = 'prologue';
    const ch = CHAPTERS[this.chapterId]; this.enterScene(ch.scene, ch.spawn);
    await fadeTo(0, 1400); this.mode = 'play';
    if (ch.onStart) await ch.onStart(this);
  },
  async continueGame() {
    const d = SaveSys.read(); if (!d) return;
    this.mode = 'transition'; Menu.closeAll(); Sfx.setMusic(false); await fadeTo(1, 900);
    this.flags = d.flags || {}; this.playtime = d.playtime || 0; this.chapterId = CHAPTERS[d.chapter] ? d.chapter : 'prologue';
    this.enterScene(SCENES[d.scene] ? d.scene : CHAPTERS[this.chapterId].scene, { x: d.x, z: d.z, rot: d.rot });
    await fadeTo(0, 1100); this.mode = 'play';
  },
  pause() { this.mode = 'pause'; Sfx.ui('move'); Menu.open(pauseMenu); },
  resume() { Menu.closeAll(); this.mode = 'play'; },
  async toTitle() { this.mode = 'transition'; Menu.closeAll(); await fadeTo(1, 800); await this.showTitle(false); },
  tip(text, seconds) { const el = $('#tip'); el.textContent = text; el.classList.add('on'); this.tipT = seconds; },
  setHint(it) { this.target = it; $('#hint').textContent = it ? (it.verb || 'Examine') : ''; $('#hint').classList.toggle('on', !!it); $('#btnAct').classList.toggle('glow', !!it); },

  /* ---- fixed cameras ---- */
  applyCam(c) {
    const cam = Gfx.camera; cam.position.set(...c.pos); cam.fov = c.fov; cam.updateProjectionMatrix(); cam.lookAt(...c.look);
  },
  /* Stay on the current camera until the player has clearly left its zone (hysteresis), then cut. */
  updateZone() {
    const p = this.player;
    if (this.zone && inRect(this.zone.rect, p.x, p.z, 0.45)) return;
    const z = this.scene.zones.find((q) => inRect(q.rect, p.x, p.z)) || this.zone || this.scene.zones[0];
    if (z !== this.zone) { this.zone = z; this.applyCam(z.cam); }
  },

  /* ---- player ---- */
  walkable(x, z) { return this.scene.walk.some((r) => inRect(r, x, z)); },
  collide(x, z) { for (let pass = 0; pass < 2; pass++) for (const b of this.scene.colliders) [x, z] = pushOut(b, x, z, CFG.playerRadius); return [x, z]; },
  move(dx, dz) {
    const p = this.player;
    for (const [mx, mz] of [[dx, dz], [dx, 0], [0, dz]]) {               // full step, else slide along one axis
      const [nx, nz] = this.collide(p.x + mx, p.z + mz);
      if (this.walkable(nx, nz)) { p.x = nx; p.z = nz; return; }
    }
  },
  updatePlayer(dt) {
    const p = this.player, ax = Input.axis(), run = Input.run(), ox = p.x, oz = p.z; let speed = 0;
    if (Settings.data.controls === 'tank') {                             // up/down = forward/back, left/right = rotate
      if (Math.abs(ax.x) > 0.3) p.rot -= Math.sign(ax.x) * Math.min(1, Math.abs(ax.x) * 1.3) * CFG.turnSpeed * (run ? 1.2 : 1) * dt;
      if (ax.y > 0.35) speed = run ? CFG.runSpeed : CFG.walkSpeed; else if (ax.y < -0.35) speed = -CFG.backSpeed;
      if (speed) this.move(Math.sin(p.rot) * speed * dt, Math.cos(p.rot) * speed * dt);
    } else if (Math.hypot(ax.x, ax.y) > 0.3) {                           // modern: push toward a screen direction
      if (!this.basis) { const v = Gfx.camera.getWorldDirection(new THREE.Vector3()), l = Math.hypot(v.x, v.z) || 1; this.basis = { fx: v.x / l, fz: v.z / l }; }
      const b = this.basis, mx = b.fx * ax.y - b.fz * ax.x, mz = b.fz * ax.y + b.fx * ax.x, l = Math.hypot(mx, mz);
      p.rot += clamp(angDiff(p.rot, Math.atan2(mx, mz)), -12 * dt, 12 * dt);
      speed = run ? CFG.runSpeed : CFG.walkSpeed; this.move(mx / l * speed * dt, mz / l * speed * dt);
    } else this.basis = null;                                            // the camera-relative basis is kept across cuts until the stick is released
    p.y = this.scene.heightAt(p.x, p.z);
    p.ch.root.position.set(p.x, p.y, p.z); p.ch.root.rotation.y = p.rot;
    const moved = dt > 0 ? Math.hypot(p.x - ox, p.z - oz) / dt : 0;
    p.ch.update(dt, { speed: Math.sign(speed) * Math.max(moved, Math.abs(speed) * 0.35), run: run && speed > 0 });
  },

  /* ---- interaction ---- */
  findTarget() {
    const p = this.player; let best = null, score = 1e9;
    for (const it of this.scene.interactables) {
      const [cx, cz] = closestOnBox(it, p.x, p.z), reach = it.reach || 0.8; let dx = cx - p.x, dz = cz - p.z; const d = Math.hypot(dx, dz);
      if (d > reach) continue;
      if (d < 0.05) { dx = it.x - p.x; dz = it.z - p.z; }
      const a = Math.abs(angDiff(p.rot, Math.atan2(dx, dz))); if (a > 1.35) continue;      // must roughly face it
      const s = d / reach + a * 0.3; if (s < score) { score = s; best = it; }
    }
    return best;
  },
  interact() {
    const it = this.target; if (!it) return;
    const key = 'seen_' + it.id, seen = !!this.flags[key]; this.flags[key] = 1;
    Promise.resolve(it.run ? it.run(this, seen) : Dialogue.say(seen && it.again ? it.again : it.lines)).catch((e) => console.error(e));
  },
  checkTriggers() {
    const p = this.player;
    for (const t of this.scene.triggers) { const inside = inRect(t.rect, p.x, p.z); if (inside && !this.inTrig[t.id] && this.mode === 'play') t.run(this); this.inTrig[t.id] = inside; }
  },

  /* ---- frame ---- */
  update(dt) {
    this.time += dt;
    if (this.mode === 'pause') return;                                   // world frozen under the pause menu
    if (this.mode === 'menu') {                                          // slow drift over the foggy street
      const c = this.scene.menuCam, t = this.time, cam = Gfx.camera;
      cam.position.set(c.pos[0] + Math.sin(t * 0.05) * 0.9, c.pos[1] + Math.sin(t * 0.07) * 0.2, c.pos[2] - 1.2 * Math.sin(t * 0.03));
      cam.lookAt(c.look[0] + Math.sin(t * 0.04) * 1.6, c.look[1], c.look[2]);
    } else {
      if (this.mode === 'play') { this.playtime += dt; this.updatePlayer(dt); this.updateZone(); this.checkTriggers(); }
      else this.player.ch.update(dt, {});
      const t = this.mode === 'play' ? this.findTarget() : null; if (t !== this.target) this.setHint(t);
    }
    for (const n of this.npcs) n.ch.update(dt, {});
    Dialogue.update(dt);
    this.scene.update(dt, this.time, Gfx.camera);
    if (this.tipT > 0 && (this.tipT -= dt) <= 0) $('#tip').classList.remove('on');
    document.body.classList.toggle('playing', this.mode === 'play'); document.body.classList.toggle('talk', Dialogue.active);
  },
};

/* ---------- 14. BOOT ----------------------------------------------------- */
async function loadThree() {
  for (const url of CFG.three) { try { return await import(url); } catch (e) { console.warn('three.js failed from', url); } }
  throw new Error('Could not load Three.js from the CDN. Check the connection and reload.');
}
async function boot() {
  try {
    THREE = await loadThree();
    Settings.load(); initShared(); TEX = buildTextures(); Gfx.init(); Game.init(); initInput(); drawTitle(); layout();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawTitle);
    $('#boot').remove();
    let last = performance.now();
    const frame = (now) => {
      requestAnimationFrame(frame);
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      Game.update(dt); Gfx.render(Game.root, Game.time);
    };
    const title = Game.showTitle(true);      // sets up the menu synchronously, then fades in
    requestAnimationFrame(frame);
    await title;
  } catch (e) { console.error(e); const b = $('#boot'); if (b) b.textContent = e.message || String(e); }
}
/* Handles for the console and for future chapter files. */
window.LM = { Game, Settings, SaveSys, Dialogue, Menu, Sfx, SCENES, CHAPTERS, registerScene, registerChapter, createCharacter };
boot();
</script>
